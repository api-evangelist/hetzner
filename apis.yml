- aid: hetzner:hetzner-zones-api
  name: Hetzner Zones API
  description: "A Zone represents a [Domain Name System (DNS) zone](https://wikipedia.org/wiki/DNS_zone)\
    \ managed by Hetzner authoritative nameservers.\nPlease see [Hetzner Docs](https://docs.hetzner.com/dns-console/dns/general/dns-overview#the-difference-between-domain-and-zone)\
    \ for the difference between zones and domains.\n\nThis API supports all zone names with [well-known\
    \ public suffixes](https://publicsuffix.org/) (e.g. `.de`, `.com`, `.co.uk`).\nSubdomains are not\
    \ supported.\n\n<h3 id=\"tag/zones/zone-modes\">Zone Modes</h3>\n\nThis API supports two types of\
    \ zone modes.\n\n- In _primary_ mode, resource record sets ([RRSets](#tag/zone-rrsets)) and resource\
    \ records (RRs) are managed via the Cloud API or Hetzner Console.\n- In _secondary_ mode, Hetzner's\
    \ nameservers query [RRSets](#tag/zone-rrsets) and RRs from given primary nameservers via [AXFR](https://en.wikipedia.org/wiki/DNS_zone_transfer).\n\
    \nThe zone mode cannot be changed, the zone must be deleted and re-created with a new mode.\n\n###\
    \ SOA Serial\n\nFor zones in primary mode, Hetzner automatically increases the `SOA` record serial\
    \ number.\nAs convention, a `YYYYMMDDnn` format with incrementing `nn` is used.\n\n<h3 id=\"tag/zones/zone-file-import\"\
    >Zone file import</h3>\n\nThis API supports importing a zone file in BIND (RFC [1034](https://datatracker.ietf.org/doc/html/rfc1034)/[1035](https://datatracker.ietf.org/doc/html/rfc1035))\
    \ format.\n\nImporting a zone file is only applicable for [Zones](#tag/zones) in primary mode.\n\n\
    During an import:\n\n- An `$ORIGIN` directive may be present, it must match the [Zone](#tag/zones)'s\
    \ name with an ending dot\n- A `$TTL` directive may be present, it is used as new default [Zone](#tag/zones)\
    \ Time To Live (TTL)\n- Only `IN` (internet) class records are allowed\n- The assigned authoritative\
    \ Hetzner nameservers must be present as `NS` records\n- A `SOA` record must be present\n- Comments\
    \ for individual records are imported, comments on their own lines are discarded\n\nZone file example:\n\
    \n```dns\n$ORIGIN\texample.com.\n$TTL\t3600\n\n@\tIN\tSOA\thydrogen.ns.hetzner.com. dns.hetzner.com.\
    \ 2024010100 86400 10800 3600000 3600\n\n@\tIN\t10800\tNS\thydrogen.ns.hetzner.com. ; Some comment.\n\
    @\tIN\t10800\tNS\toxygen.ns.hetzner.com.\n@\tIN\t10800\tNS\thelium.ns.hetzner.de.\n```"
  humanURL: https://docs.hetzner.cloud/
  baseURL: https://api.hetzner.cloud/v1
  tags:
  - Zones
