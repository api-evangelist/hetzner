  /servers/{id}/metrics:
    get:
      operationId: get_server_metrics
      summary: Get Metrics for a Server
      description: 'Get Metrics for specified Server.


        You must specify the type of metric to get: cpu, disk or network. You can also specify more than one type by comma separation, e.g. cpu,disk.


        Depending on the type you will get different time series data


        | Type    | Timeseries              | Unit      | Description                                          |

        |---------|-------------------------|-----------|------------------------------------------------------|

        | cpu     | cpu                     | percent   | Percent CPU usage                                    |

        | disk    | disk.0.iops.read        | iop/s     | Number of read IO operations per second              |

        |         | disk.0.iops.write       | iop/s     | Number of write IO operations per second             |

        |         | disk.0.bandwidth.read   | bytes/s   | Bytes read per second                                |

        |         | disk.0.bandwidth.write  | bytes/s   | Bytes written per second                             |

        | network | network.0.pps.in        | packets/s | Public Network interface packets per second received |

        |         | network.0.pps.out       | packets/s | Public Network interface packets per second sent     |

        |         | network.0.bandwidth.in  | bytes/s   | Public Network interface bytes/s received            |

        |         | network.0.bandwidth.out | bytes/s   | Public Network interface bytes/s sent                |


        Metrics are available for the last 30 days only.


        If you do not provide the step argument we will automatically adjust it so that a maximum of 200 samples are returned.


        We limit the number of samples returned to a maximum of 500 and will adjust the step parameter accordingly.

        '
      tags:
      - Servers
      parameters:
      - description: ID of the Server.
        name: id
        in: path
        required: true
        schema:
          description: ID of the [Server](#tag/servers).
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          example: 42
      - description: Type of metrics to get.
        name: type
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
            enum:
            - cpu
            - disk
            - network
      - description: Start of period to get Metrics for (must be in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
        name: start
        in: query
        required: true
        schema:
          type: string
      - description: End of period to get Metrics for (must be in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
        name: end
        in: query
        required: true
        schema:
          type: string
      - description: Resolution of results in seconds.
        name: step
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Request succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: object
                    properties:
                      start:
                        description: Start of period of metrics reported (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                        type: string
                        format: date-time
                        example: '2017-01-01T00:00:00Z'
                      end:
                        description: End of period of metrics reported (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                        type: string
                        format: date-time
                        example: '2017-01-01T23:00:00Z'
                      step:
                        description: Resolution of results in seconds.
                        type: number
                        example: 60
                      time_series:
                        description: Hash with timeseries information, containing the name of timeseries as key.
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            values:
                              type: array
                              items:
                                type: array
                                items:
                                  oneOf:
                                  - type: number
                                  - type: string
                              description: Metrics Timestamps with values.
                          required:
                          - values
                        example:
                          name_of_timeseries:
                            values:
                            - - 1435781470.622
                              - '42'
                            - - 1435781471.622
                              - '43'
                    required:
                    - start
                    - end
                    - step
                    - time_series
                required:
                - metrics
