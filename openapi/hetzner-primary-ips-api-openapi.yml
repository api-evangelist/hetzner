    post:
      operationId: create_primary_ip
      summary: Create a Primary IP
      description: 'Create a new [Primary IP](#tag/primary-ips).


        Can optionally be assigned to a resource by providing an `assignee_id` and `assignee_type`.


        If not assigned to a resource the `location` key needs to be provided. This can be either the ID or the name of the [Location](#tag/locations) this [Primary IP](#tag/primary-ips) shall be created in.


        A [Primary IP](#tag/primary-ips) can only be assigned to resource in the same [Location](#tag/locations) later on.


        The `datacenter` key is deprecated in favor of `location` and will be removed after 01 July 2026.


        #### Operation specific errors


        | Status | Code | Description |

        | --- | --- | --- |

        | `422` | `server_not_stopped` | The specified [Server](#tag/servers) is running, but needs to be powered off |

        | `422` | `server_has_ipv4` | The [Server](#tag/servers) already has an ipv4 address |

        | `422` | `server_has_ipv6` | The [Server](#tag/servers) already has an ipv6 address |

        '
      tags:
      - Primary IPs
      requestBody:
        description: 'Request Body for creating a new [Primary IP](#tag/primary-ips).


          The `location`, `datacenter` and `assignee_id`/`assignee_type` attributes are mutually exclusive.

          '
        required: true
        content:
          application/json:
            schema:
              title: PrimaryIPCreateRequest
              type: object
              properties:
                name:
                  description: Name of the Resource. Must be unique per Project.
                  type: string
                  example: my-resource
                labels:
                  description: 'User-defined labels (`key/value` pairs) for the Resource.

                    For more information, see "[Labels](#description/labels)".

                    '
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    environment: prod
                    example.com/my: label
                    just-a-key: ''
                type:
                  description: '[Primary IP](#tag/primary-ips) type.'
                  type: string
                  enum:
                  - ipv4
                  - ipv6
                  example: ipv6
                datacenter:
                  deprecated: true
                  description: '**Deprecated**: This property is deprecated and will be removed after 1 July 2026.

                    Use the `location` key instead.


                    [Data Center](#tag/data-centers) ID or name.


                    The [Primary IP](#tag/primary-ips) will be bound to this [Data Center](#tag/data-centers).

                    Omit if `assignee_id`/`assignee_type` or `location` are provided.

                    '
                  oneOf:
                  - description: '**Deprecated**: This property is deprecated and will be removed after 1 July 2026.

                      Use the `location` key instead.


                      [Data Center](#tag/data-centers) ID or name.


                      The [Primary IP](#tag/primary-ips) will be bound to this [Data Center](#tag/data-centers).

                      Omit if `assignee_id`/`assignee_type` or `location` are provided.

                      '
                    type: string
                    example: fsn1-dc8
                  - description: '**Deprecated**: This property is deprecated and will be removed after 1 July 2026.

                      Use the `location` key instead.


                      [Data Center](#tag/data-centers) ID or name.


                      The [Primary IP](#tag/primary-ips) will be bound to this [Data Center](#tag/data-centers).

                      Omit if `assignee_id`/`assignee_type` or `location` are provided.

                      '
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9007199254740991
                    example: 42
                location:
                  description: '[Location](#tag/locations) ID or name the [Primary IP](#tag/primary-ips) will be bound to.


                    Omit if `assignee_id`/`assignee_type` or `datacenter` are provided.

                    '
                  oneOf:
                  - description: '[Location](#tag/locations) ID or name the [Primary IP](#tag/primary-ips) will be bound to.


                      Omit if `assignee_id`/`assignee_type` or `datacenter` are provided.

                      '
                    type: string
                    example: fsn1
                  - description: '[Location](#tag/locations) ID or name the [Primary IP](#tag/primary-ips) will be bound to.


                      Omit if `assignee_id`/`assignee_type` or `datacenter` are provided.

                      '
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9007199254740991
                    example: 42
                assignee_type:
                  description: 'Type of resource the [Primary IP](#tag/primary-ips) can get assigned to.


                    Currently [Primary IPs](#tag/primary-ips) can only be assigned to [Servers](#tag/servers),

                    therefore this field must be set to `server`.

                    '
                  type: string
                  enum:
                  - server
                  example: server
                assignee_id:
                  description: 'ID of resource to assign the [Primary IP](#tag/primary-ips) to.


                    Omitted if the [Primary IP](#tag/primary-ips) should not get assigned.

                    '
                  type: integer
                  format: int64
                  nullable: true
                  example: 17
                auto_delete:
                  example: false
                  description: 'Auto deletion state.


                    If enabled the [Primary IP](#tag/primary-ips) will be deleted once the assigned resource gets deleted.

                    '
                  type: boolean
                  default: false
              required:
              - name
              - type
              - assignee_type
