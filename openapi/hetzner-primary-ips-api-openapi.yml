openapi: 3.2.0
info:
  title: Hetzner Cloud Primary IPs API
  version: 1.0.0
  x-summary: 'Manage Hetzner Cloud services and resources linked to them, such as Floating IPs, Volumes and Load Balancers.

    '
  description: '# Overview


    This is the official documentation for the Hetzner Cloud API.'
servers:
- url: https://api.hetzner.cloud/v1
security:
- APIToken: []
tags:
- name: Primary IPs
  description: Primary IPs help you to create more flexible networking setups.
paths:
  /primary_ips:
    get:
      operationId: list_primary_ips
      summary: List Primary IPs
      description: 'List multiple Primary IPs.


        Use the provided URI parameters to modify the result.'
      tags:
      - Primary IPs
      parameters:
      - description: 'Filter resources by their name.


          The response will only contain the resources

          matching exactly the specified name.

          '
        name: name
        in: query
        required: false
        schema:
          type: string
      - description: 'Filter resources by labels.


          The response will only contain resources matching the label selector.

          For more information, see "[Label Selector](#description/label-selector)".

          '
        name: label_selector
        in: query
        required: false
        schema:
          type: string
      - description: Filter results by IP address.
        name: ip
        in: query
        required: false
        schema:
          type: string
        example: 127.0.0.1
      - description: Page number to return. For more information, see "[Pagination](#description/pagination)".
        name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1
          example: 1
      - description: Maximum number of entries returned per page. For more information, see "[Pagination](#description/pagination)".
        name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 25
          example: 25
      - description: 'Sort resources by field and direction. May be used multiple times.


          For more information, see "[Sorting](#description/sorting)".

          '
        name: sort
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - id:asc
            - id:desc
            - created
            - created:asc
            - created:desc
      responses:
        '200':
          description: Request succeeded.
          content:
            application/json:
              schema:
                title: PrimaryIPsResponse
                type: object
                properties:
                  primary_ips:
                    type: array
                    items:
                      title: PrimaryIP
                      type: object
                      properties:
                        id:
                          description: ID of the [Primary IP](#tag/primary-ips).
                          type: integer
                          format: int64
                          minimum: 1
                          maximum: 9007199254740991
                          example: 42
                        name:
                          description: Name of the Resource. Must be unique per Project.
                          type: string
                          example: my-resource
                        labels:
                          description: 'User-defined labels (`key/value` pairs) for the Resource.

                            For more information, see "[Labels](#description/labels)".

                            '
                          type: object
                          additionalProperties:
                            type: string
                          example:
                            environment: prod
                            example.com/my: label
                            just-a-key: ''
                        created:
                          description: Point in time when the Resource was created (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                          type: string
                          format: date-time
                          example: '2016-01-30T23:55:00Z'
                        blocked:
                          description: Blocked state of the [Primary IP](#tag/primary-ips).
                          type: boolean
                          example: false
                        datacenter:
                          deprecated: true
                          description: '**Deprecated**: This property is deprecated and will be removed after the 1 July 2026.

                            Use the `location` property instead.


                            [Data Center](#tag/data-centers) of the [Primary IP](#tag/primary-ips).

                            '
                          type: object
                          properties:
                            id:
                              description: ID of the [Data Center](#tag/data-centers).
                              type: integer
                              format: int64
                              minimum: 1
                              maximum: 9007199254740991
                              example: 42
                            name:
                              description: 'Unique name for the [Data Center](#tag/data-centers).


                                May be used as a more descriptive identifier.

                                '
                              type: string
                              pattern: ^[a-z0-9]+(-?[a-z0-9]*)*$
                              example: fsn1-dc8
                            description:
                              description: 'Descriptive name for the [Data Center](#tag/data-centers).


                                Desired to be easy to understand for humans. May change for cosmetic reasons. Must not be used as an identifier.

                                '
                              type: string
                              example: Falkenstein DC Park 8
                            location:
                              description: '[Location](#tag/locations) the [Data Center](#tag/data-centers) is located at.

                                '
                              type: object
                              properties:
                                id:
                                  description: ID of the [Location](#tag/locations).
                                  type: integer
                                  format: int64
                                  minimum: 1
                                  maximum: 9007199254740991
                                  example: 42
                                name:
                                  description: Unique identifier of the [Location](#tag/locations).
                                  type: string
                                  pattern: ^[a-z0-9]+(-?[a-z0-9]*)*$
                                  example: fsn1
                                description:
                                  description: Human readable description of the [Location](#tag/locations).
                                  type: string
                                  example: Falkenstein DC Park 1
                                country:
                                  description: 'Country the [Location](#tag/locations) resides in.


                                    ISO 3166-1 alpha-2 code of the country.

                                    '
                                  type: string
                                  example: DE
                                city:
                                  description: 'Name of the closest city to the [Location](#tag/locations).


                                    City name or city name and state in short form. E.g. `Falkenstein` or `Ashburn, VA`.

                                    '
                                  type: string
                                  example: Falkenstein
                                latitude:
                                  description: Latitude of the city closest to the [Location](#tag/locations).
                                  type: number
                                  format: double
                                  example: 50.47612
                                longitude:
                                  description: Longitude of the city closest to the [Location](#tag/locations).
                                  type: number
                                  format: double
                                  example: 12.370071
                                network_zone:
                                  description: Name of the Network Zone this [Location](#tag/locations) resides in.
                                  type: string
                                  pattern: ^[a-z0-9]+(-?[a-z0-9]*)*$
                                  example: eu-central
                              required:
                              - id
                              - name
                              - description
                              - country
                              - city
                              - latitude
                              - longitude
                              - network_zone
                            server_types:
                              deprecated: true
                              description: 'This field is deprecated, as all of it''s properties are deprecated.


                                [Server Types](#tag/server-types) supported and available in this [Data Center](#tag/data-centers).

                                '
                              type: object
                              properties:
                                supported:
                                  deprecated: true
                                  description: 'This field is deprecated. Use the [Server Type](#tag/server-types) `locations` field instead.


                                    List of [Server Types](#tag/server-types) supported in this [Data Center](#tag/data-centers).


                                    These [Server Types](#tag/server-types) are generally available in this Data Center, but may be

                                    temporarily out of stock.

                                    '
                                  type: array
                                  items:
                                    type: integer
                                    format: int64
                                  example:
                                  - 1
                                  - 2
                                  - 3
                                available:
                                  deprecated: true
                                  description: 'This field is deprecated. Use the `available` flag in the [Server Type](#tag/server-types) `locations` field instead (`server_type.locations[].available`).


                                    [Server Types](#tag/server-types) currently available in this [Data Center](#tag/data-centers).


                                    These [Server Types](#tag/server-types) can currently be purchased. Types that are temporarily unavailable

                                    but are supported in this [Data Center](#tag/data-centers) are listed as `supported`.

                                    '
                                  type: array
                                  items:
                                    type: integer
                                    format: int64
                                  example:
                                  - 1
                                  - 2
                                  - 3
                                available_for_migration:
                                  deprecated: true
                                  description: 'This field is deprecated. Use the `available` flag in the [Server Type](#tag/server-types) `locations` field instead (`server_type.locations[].available`).


                                    [Server Types](#tag/server-types) available to migrate to in this [Data Center](#tag/data-centers).


                                    Existing [Servers](#tag/servers) can be migrated to these [Server Types](#tag/server-types).

                                    '
                                  type: array
                                  items:
                                    type: integer
                                    format: int64
                                  example:
                                  - 1
                                  - 2
                                  - 3
                              required:
                              - supported
                              - available
                              - available_for_migration
                          required:
                          - id
                          - name
                          - description
                          - location
                          - server_types
                        location:
                          description: '[Location](#tag/locations) of the [Primary IP](#tag/primary-ips).

