                          type: boolean
                          default: false
                          example: true
                        assignee_type:
                          description: 'Type of resource the [Primary IP](#tag/primary-ips) can get assigned to.

                            '
                          type: string
                          enum:
                          - server
                          example: server
                        assignee_id:
                          description: 'ID of resource the [Primary IP](#tag/primary-ips) is assigned to.


                            `null` if the [Primary IP](#tag/primary-ips) is not assigned.

                            '
                          type:
                          - integer
                          - 'null'
                          format: int64
                          example: 17
