                              type: boolean
                              example: false
                          required:
                          - delete
                        type:
                          description: '[Primary IP](#tag/primary-ips) type.'
                          type: string
                          enum:
                          - ipv4
                          - ipv6
                          example: ipv6
                        auto_delete:
