      - lang: Shell
        label: CLI
        source: hcloud zone rrset change-ttl $ZONE $RR_NAME $RR_TYPE --ttl 3600
  /zones/{id_or_name}/rrsets/{rr_name}/{rr_type}/actions/set_records:
    post:
      operationId: set_zone_rrset_records
      summary: Set Records of an RRSet
      description: 'Overwrites the resource records (RRs) of an existing RRSet in the Zone.


        Only applicable for Zones in primary mode.


        #### Operation specific errors


        | Status | Code | Description |

        | --- | --- | --- |

        | `422` | `incorrect_zone_mode` | This operation is not supported for this Zone''s `mode`. |'
      tags:
      - Zone RRSet Actions
      parameters:
      - description: ID or Name of the Zone.
        name: id_or_name
        in: path
        required: true
        schema:
          description: ID or Name of the [Zone](#tag/zones).
          type: string
      - name: rr_name
        in: path
        required: true
        schema:
          description: 'Name of the [RRSet](#tag/zone-rrsets).


            The name must be in lower case, and must not end with a dot or the [Zone](#tag/zones)

            name. Names containing non-ASCII characters must be transcribed to

            [Punycode](https://wikipedia.org/wiki/Punycode) representation with ACE prefix, e.g.

            `xn--4bi` (✉️).


            For the [Zone](#tag/zones) apex, use `@`.

            '
          type: string
          example: www
      - name: rr_type
        in: path
        required: true
        schema:
          description: 'Type of the [RRSet](#tag/zone-rrsets).

            '
          type: string
          enum:
          - A
          - AAAA
          - CAA
          - CNAME
          - DS
          - HINFO
          - HTTPS
          - MX
          - NS
          - PTR
          - RP
          - SOA
          - SRV
          - SVCB
          - TLSA
          - TXT
          example: A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                records:
                  description: 'Records to set in the [RRSet](#tag/zone-rrsets).


                    Must not be empty and must only contain distinct record values.

                    '
                  minItems: 1
                  maxItems: 50
                  type: array
                  items:
                    title: Record
                    description: 'Record of a [RRSet](#tag/zone-rrsets).


                      The `value` is used to identify the record in an [RRSet](#tag/zone-rrsets).

                      '
                    type: object
                    properties:
                      value:
                        description: 'Value of the record.


                          For details about accepted values, see the [DNS record types documentation](https://docs.hetzner.com/networking/dns/record-types/overview/).

                          '
                        type: string
                        example: 198.51.100.1
                      comment:
                        description: Comment of the record.
                        type: string
                        example: My web server at Hetzner Cloud.
                    required:
                    - value
              required:
              - records
      responses:
        '201':
          description: Request succeeded.
          content:
            application/json:
              schema:
                title: ActionResponse
                description: 'Response for a created [Action](#description/actions).


                  Make sure to wait for the [Action](#description/actions) completion to ensure your changes are applied.

                  '
                type: object
                properties:
                  action:
                    title: Action
                    type: object
                    properties:
                      id:
                        description: ID of the [Action](#description/actions).
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9007199254740991
                        example: 42
                      command:
                        description: Command executed in the Action.
                        type: string
                        example: start_resource
                      status:
                        description: Status of the Action.
                        type: string
                        enum:
                        - running
                        - success
                        - error
                      started:
                        description: Point in time when the Action was started (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                        type: string
                        format: date-time
                        example: '2016-01-30T23:55:00Z'
                      finished:
                        description: Point in time when the Action was finished (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format). Only set if the Action is finished otherwise null.
                        type:
                        - string
