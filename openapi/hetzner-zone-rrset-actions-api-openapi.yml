openapi: 3.2.0
info:
  title: Hetzner Cloud Zone RRSet Actions API
  version: 1.0.0
  x-summary: 'Manage Hetzner Cloud services and resources linked to them, such as Floating IPs, Volumes and Load Balancers.

    '
  description: '# Overview


    This is the official documentation for the Hetzner Cloud API.'
servers:
- url: https://api.hetzner.cloud/v1
security:
- APIToken: []
tags:
- name: Zone RRSet Actions
paths:
  /zones/{id_or_name}/rrsets/{rr_name}/{rr_type}/actions/change_protection:
    post:
      operationId: change_zone_rrset_protection
      summary: Change an RRSet's Protection
      description: 'Changes the protection of an RRSet in the Zone.


        Only applicable for Zones in primary mode.


        #### Operation specific errors


        | Status | Code | Description |

        | --- | --- | --- |

        | `422` | `incorrect_zone_mode` | This operation is not supported for this Zone''s `mode`. |'
      tags:
      - Zone RRSet Actions
      parameters:
      - description: ID or Name of the Zone.
        name: id_or_name
        in: path
        required: true
        schema:
          description: ID or Name of the [Zone](#tag/zones).
          type: string
      - name: rr_name
        in: path
        required: true
        schema:
          description: 'Name of the [RRSet](#tag/zone-rrsets).


            The name must be in lower case, and must not end with a dot or the [Zone](#tag/zones)

            name. Names containing non-ASCII characters must be transcribed to

            [Punycode](https://wikipedia.org/wiki/Punycode) representation with ACE prefix, e.g.

            `xn--4bi` (✉️).


            For the [Zone](#tag/zones) apex, use `@`.

            '
          type: string
          example: www
      - name: rr_type
        in: path
        required: true
        schema:
          description: 'Type of the [RRSet](#tag/zone-rrsets).

            '
          type: string
          enum:
          - A
          - AAAA
          - CAA
          - CNAME
          - DS
          - HINFO
          - HTTPS
          - MX
          - NS
          - PTR
          - RP
          - SOA
          - SRV
          - SVCB
          - TLSA
          - TXT
          example: A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: 'Protection of the [RRSet](#tag/zone-rrsets).

                '
              type: object
              properties:
                change:
                  description: Prevent the Resource from being changed.
                  type: boolean
                  example: false
              required:
              - change
      responses:
        '201':
          description: Request succeeded.
          content:
            application/json:
              schema:
                title: ActionResponse
                description: 'Response for a created [Action](#description/actions).


                  Make sure to wait for the [Action](#description/actions) completion to ensure your changes are applied.

                  '
                type: object
                properties:
                  action:
                    title: Action
                    type: object
                    properties:
                      id:
                        description: ID of the [Action](#description/actions).
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9007199254740991
                        example: 42
                      command:
                        description: Command executed in the Action.
                        type: string
                        example: start_resource
                      status:
                        description: Status of the Action.
                        type: string
                        enum:
                        - running
                        - success
                        - error
                      started:
                        description: Point in time when the Action was started (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                        type: string
                        format: date-time
                        example: '2016-01-30T23:55:00Z'
                      finished:
                        description: Point in time when the Action was finished (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format). Only set if the Action is finished otherwise null.
                        type:
                        - string
                        - 'null'
                        format: date-time
                        example: '2016-01-30T23:55:00Z'
                      progress:
                        description: Progress of the Action in percent.
                        type: integer
                        format: int32
                        example: 100
                      resources:
                        description: Resources the Action relates to.
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: ID of the Resource.
                              type: integer
                              format: int64
                              minimum: 1
                              maximum: 9007199254740991
                              example: 42
                            type:
                              description: Type of the Resource.
                              type: string
                              example: server
                          required:
                          - id
                          - type
                      error:
                        description: Error message for the Action if an error occurred, otherwise null.
                        type:
                        - object
                        - 'null'
                        properties:
                          code:
                            description: Fixed error code for machines.
                            type: string
                            example: action_failed
                          message:
                            description: Error message for humans.
                            type: string
                            example: Action failed
                        required:
                        - code
                        - message
                    required:
                    - id
                    - command
                    - status
                    - progress
                    - started
                    - finished
                    - resources
                    - error
                required:
                - action
              examples:
                default:
                  value:
                    action:
                      id: 1
                      command: change_rrset_protection
                      status: running
                      progress: 50
                      started: '2016-01-30T23:55:00Z'
                      finished: null
                      resources:
                      - id: 42
                        type: zone
                      error: null
        4xx:
          description: Request failed with a user error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        description: Error code for machines.
                        type: string
                      message:
                        description: Error message for humans.
                        type: string
                      details:
                        description: Details about the error.
                        type:
                        - object
                        - 'null'
                    required:
                    - code
                    - message
                required:
                - error
                example:
                  error:
                    code: unauthorized
                    message: unable to authenticate
                    details: null
        5xx:
          description: Request failed with a server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        description: Error code for machines.
                        type: string
                      message:
                        description: Error message for humans.
                        type: string
                      details:
                        description: Details about the error.
                        type:
                        - object
                        - 'null'
                    required:
                    - code
                    - message
                required:
                - error
                example:
                  error:
                    code: timeout
                    message: request timeout
                    details: null
      security:
      - APIToken: []
      x-codeSamples:
      - lang: Go
        label: Go
        source: "package examples\n\nimport (\n\t\"context\"\n\t\"os\"\n\n\t\"github.com/hetznercloud/hcloud-go/v2/hcloud\"\n)\n\nfunc main() {\n\ttoken := os.Getenv(\"HCLOUD_TOKEN\")\n\n\tclient := hcloud.NewClient(hcloud.WithToken(token))\n\tctx := context.TODO()\n\n\taction, _, err := client.Zone.ChangeRRSetProtection(ctx, &hcloud.ZoneRRSet{\n\t\tZone: &hcloud.Zone{Name: \"example.com\"},\n\t\tName: \"www\",\n\t\tType: hcloud.ZoneRRSetTypeA,\n\t}, hcloud.ZoneRRSetChangeProtectionOpts{\n\t\tChange: hcloud.Ptr(false),\n\t})\n\n\terr = client.Action.WaitFor(ctx, action)\n}"
      - lang: Python
        label: Python
        source: "from __future__ import annotations\n\nfrom os import environ\n\nfrom hcloud import Client\nfrom hcloud.zones import Zone, ZoneRRSet\n\ntoken = environ[\"HCLOUD_TOKEN\"]\nclient = Client(token=token)\n\naction = client.zones.change_rrset_protection(\n    rrset=ZoneRRSet(\n        zone=Zone(name=\"example.com\"),\n        name=\"www\",\n        type=\"A\",\n    ),\n    change=False,\n)\n\naction.wait_until_finished()"
      - lang: Shell
        label: CLI
        source: 'hcloud zone rrset enable-protection $ZONE $RR_NAME $RR_TYPE change

          hcloud zone rrset disable-protection $ZONE $RR_NAME $RR_TYPE change'
  /zones/{id_or_name}/rrsets/{rr_name}/{rr_type}/actions/change_ttl:
