            '
          type: string
          enum:
          - A
          - AAAA
          - CAA
          - CNAME
          - DS
          - HINFO
          - HTTPS
          - MX
          - NS
          - PTR
          - RP
          - SOA
          - SRV
          - SVCB
          - TLSA
          - TXT
          example: A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl:
                  description: 'Time To Live (TTL) of the [RRSet](#tag/zone-rrsets).


                    Must be in between 60s and 2147483647s.


                    If not set, the [Zone''s](#tag/zones) Default TTL is used.

                    '
                  type:
                  - integer
                  - 'null'
                  minimum: 60
                  maximum: 2147483647
                  example: 3600
              required:
              - ttl
