                    - command
                    - status
                    - progress
                    - started
                    - finished
                    - resources
                    - error
                  next_actions:
                    type: array
                    items:
                      title: Action
                      type: object
                      properties:
                        id:
                          description: ID of the [Action](#description/actions).
                          type: integer
