    post:
      operationId: create_zone
      summary: Create a Zone
      description: 'Creates a [Zone](#tag/zones).


        A default `SOA` and three `NS` resource records with the assigned Hetzner

        nameservers are created automatically.

        '
      tags:
      - Zones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: 'Name of the [Zone](#tag/zones).


                    All names with [well-known public suffixes](https://publicsuffix.org/) (e.g. `.de`,

                    `.com`, `.co.uk`) are supported. Subdomains are not supported.


                    The name must be in lower case and must not end with a dot.

                    [Internationalized domain

                    names](https://en.wikipedia.org/wiki/Internationalized_domain_name) must be

                    transcribed to [Punycode](https://wikipedia.org/wiki/Punycode) representation with

                    ACE prefix, e.g. `xn--mnchen-3ya.de` (`münchen.de`).

                    '
                  type: string
                  maxLength: 255
                  example: example.com
                mode:
                  description: 'Mode of the [Zone](#tag/zones).


                    For more information, see [Zone Modes](#tag/zones/zone-modes).

                    '
                  type: string
                  enum:
                  - primary
                  - secondary
                  example: primary
                ttl:
                  description: 'Default Time To Live (TTL) of the [Zone](#tag/zones).


                    Must be in between 60s and 2147483647s.


                    This TTL is used for [RRSets](#tag/zone-rrsets) that do not explicitly define a TTL.

                    '
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 2147483647
                  example: 10800
                labels:
                  description: 'User-defined labels (`key/value` pairs) for the Resource.

                    For more information, see "[Labels](#description/labels)".

                    '
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    environment: prod
                    example.com/my: label
                    just-a-key: ''
                primary_nameservers:
                  description: 'Primary nameservers of the [Zone](#tag/zones).


                    Only applicable for [Zones](#tag/zones) in secondary mode.

                    Ignored for [Zones](#tag/zones) in primary mode.

                    '
                  type: array
                  items:
                    description: 'Primary nameserver that returns [Zones](#tag/zones) via `AXFR`.


                      Must allow queries from and may send `NOTIFY` queries to [Hetzner''s secondary

                      nameservers](https://docs.hetzner.com/dns-console/dns/general/authoritative-name-servers#secondary-dns-servers-old-name-servers-for-robot-customers).

                      '
                    type: object
                    properties:
                      address:
                        description: Public IPv4 or IPv6 address of the primary nameserver.
                        type: string
                        example: 198.51.100.1
                      port:
                        description: Port of the primary nameserver.
                        type: integer
                        default: 53
                        example: 5353
                      tsig_key:
                        description: '[Transaction signature (TSIG)](https://en.wikipedia.org/wiki/TSIG) key to use

                          for the zone transfer. Must be base64 encoded.

                          '
                        type: string
                      tsig_algorithm:
                        description: '[Transaction signature (TSIG)](https://en.wikipedia.org/wiki/TSIG) algorithm

                          used to generate the TSIG key.

                          '
                        type: string
                        enum:
                        - hmac-md5
                        - hmac-sha1
                        - hmac-sha256
                    required:
                    - address
                  example:
                  - address: 198.51.100.1
                    port: 53
                  - address: 203.0.113.1
                    port: 53
                rrsets:
                  description: '[RRSets](#tag/zone-rrsets) to be added to the [Zone](#tag/zones).


                    Only applicable for [Zones](#tag/zones) in primary mode.

                    Ignored for [Zones](#tag/zones) in secondary mode.

                    '
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        description: 'Name of the [RRSet](#tag/zone-rrsets).


                          The name must be in lower case, and must not end with a dot or the [Zone](#tag/zones)

                          name. Names containing non-ASCII characters must be transcribed to

                          [Punycode](https://wikipedia.org/wiki/Punycode) representation with ACE prefix, e.g.

                          `xn--4bi` (✉️).


                          For the [Zone](#tag/zones) apex, use `@`.

                          '
                        type: string
                        example: www
                      type:
                        description: 'Type of the [RRSet](#tag/zone-rrsets).

                          '
                        type: string
                        enum:
                        - A
                        - AAAA
                        - CAA
                        - CNAME
                        - DS
                        - HINFO
                        - HTTPS
                        - MX
                        - NS
                        - PTR
                        - RP
                        - SOA
                        - SRV
                        - SVCB
                        - TLSA
                        - TXT
                        example: A
                      ttl:
                        description: 'Time To Live (TTL) of the [RRSet](#tag/zone-rrsets).


                          Must be in between 60s and 2147483647s.


                          If not set, the [Zone''s](#tag/zones) Default TTL is used.

                          '
                        type: integer
                        nullable: true
                        minimum: 60
                        maximum: 2147483647
                        example: 3600
                      records:
                        description: 'Records of the [RRSet](#tag/zone-rrsets).


                          Must not be empty and must only contain distinct record values.

                          The order of records returned in responses is not guaranteed to be consistent.

                          '
                        type: array
                        items:
                          title: Record
                          description: 'Record of a [RRSet](#tag/zone-rrsets).


                            The `value` is used to identify the record in an [RRSet](#tag/zone-rrsets).

                            '
                          type: object
                          properties:
                            value:
                              description: 'Value of the record.


                                For details about accepted values, see the [DNS record types documentation](https://docs.hetzner.com/networking/dns/record-types/overview/).

                                '
                              type: string
                              example: 198.51.100.1
                            comment:
                              description: Comment of the record.
                              type: string
                              example: My web server at Hetzner Cloud.
                          required:
                          - value
                      labels:
                        description: 'User-defined labels (`key/value` pairs) for the Resource.

                          For more information, see "[Labels](#description/labels)".

                          '
                        type: object
                        additionalProperties:
                          type: string
                        example:
                          environment: prod
                          example.com/my: label
                          just-a-key: ''
                    required:
                    - name
                    - type
                    - records
                zonefile:
                  description: 'Zone file to import.


                    Only applicable for [Zones](#tag/zones) in primary mode.

                    Ignored for [Zones](#tag/zones) in secondary mode.


                    If provided, `rrsets` must be empty.


                    See [Zone file import](#tag/zones/zone-file-import) for more details.

                    '
                  type: string
                  example: "$ORIGIN\texample.com.\n$TTL\t3600\n\n@\tIN\tSOA\thydrogen.ns.hetzner.com. dns.hetzner.com. 2024010100 86400 10800 3600000 3600\n\n@\tIN\t10800\tNS\thydrogen.ns.hetzner.com. ; Some comment.\n@\tIN\t10800\tNS\toxygen.ns.hetzner.com.\n@\tIN\t10800\tNS\thelium.ns.hetzner.de.\n"
              required:
              - name
              - mode
            examples:
              primary:
                value:
                  name: example.com
                  mode: primary
                  ttl: 10800
                  labels:
                    key: value
                  rrsets:
                  - name: www
                    type: A
                    records:
                    - value: 198.51.100.1
                      comment: My web server at Hetzner Cloud.
              primary from zone file:
                value:
                  name: example.com
                  mode: primary
                  ttl: 10800
                  labels:
                    key: value
                  zonefile: "$ORIGIN\texample.com.\n$TTL\t10800\n\n@\tIN\tA\t198.51.100.1 ; My web server at Hetzner Cloud.\n"
              secondary:
                value:
                  name: example.com
                  mode: secondary
                  ttl: 10800
                  labels:
                    key: value
                  primary_nameservers:
                  - address: 198.51.100.1
                    port: 53
                  - address: 203.0.113.1
                    port: 53
