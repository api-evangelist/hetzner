      - lang: Shell
        label: CLI (secondary)
        source: "hcloud zone create \\\n    --name example.com \\\n    --mode secondary \\\n    --ttl 10800 \\\n    --label \"key=value\" \\\n    --primary-nameservers-file <(echo '[\n        {\"address\": \"198.51.100.1\", \"port\": 53},\n        {\"address\": \"203.0.113.1\", \"port\": 53}\n    ]')"
