openapi: 3.2.0
info:
  title: Hetzner Cloud Zones API
  version: 1.0.0
  x-summary: 'Manage Hetzner Cloud services and resources linked to them, such as Floating IPs, Volumes and Load Balancers.

    '
  description: '# Overview


    This is the official documentation for the Hetzner Cloud API.'
servers:
- url: https://api.hetzner.cloud/v1
security:
- APIToken: []
tags:
- name: Zones
  description: A Zone represents a Domain Name System (DNS) zone managed by Hetzner authoritative nameservers.
paths:
  /zones:
    get:
      operationId: list_zones
      summary: List Zones
      description: 'Returns all Zones.


        Use the provided URI parameters to modify the result.'
      tags:
      - Zones
      parameters:
      - description: 'Filter resources by their name.


          The response will only contain the resources

          matching exactly the specified name.

          '
        name: name
        in: query
        required: false
        schema:
          type: string
      - description: 'Filter resources by their mode.


          The response will only contain the resources matching exactly the specified mode.

          '
        name: mode
        in: query
        required: false
        schema:
          description: 'Mode of the [Zone](#tag/zones).


            For more information, see [Zone Modes](#tag/zones/zone-modes).

            '
          type: string
          enum:
          - primary
          - secondary
          example: primary
      - description: 'Filter resources by labels.


          The response will only contain resources matching the label selector.

          For more information, see "[Label Selector](#description/label-selector)".

          '
        name: label_selector
        in: query
        required: false
        schema:
          type: string
      - description: 'Sort resources by field and direction. May be used multiple times.


          For more information, see "[Sorting](#description/sorting)".

          '
        name: sort
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - id:asc
            - id:desc
            - name
            - name:asc
            - name:desc
            - created
            - created:asc
            - created:desc
      - description: Page number to return. For more information, see "[Pagination](#description/pagination)".
        name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1
          example: 1
      - description: Maximum number of entries returned per page. For more information, see "[Pagination](#description/pagination)".
        name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 25
          example: 25
      responses:
        '200':
          description: Request succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  zones:
                    type: array
                    items:
                      title: Zone
                      oneOf:
                      - title: Primary Zone
                        allOf:
                        - type: object
                          properties:
                            id:
                              description: ID of the [Zone](#tag/zones).
                              type: integer
                              format: int64
                              minimum: 1
                              maximum: 9007199254740991
                              example: 42
                            name:
                              description: 'Name of the [Zone](#tag/zones).


                                All names with [well-known public suffixes](https://publicsuffix.org/) (e.g. `.de`,

                                `.com`, `.co.uk`) are supported. Subdomains are not supported.


                                The name must be in lower case and must not end with a dot.

                                [Internationalized domain

                                names](https://en.wikipedia.org/wiki/Internationalized_domain_name) must be

                                transcribed to [Punycode](https://wikipedia.org/wiki/Punycode) representation with

                                ACE prefix, e.g. `xn--mnchen-3ya.de` (`münchen.de`).

                                '
                              type: string
                              maxLength: 255
                              example: example.com
                            created:
                              description: Point in time when the Resource was created (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                              type: string
                              format: date-time
                              example: '2016-01-30T23:55:00Z'
                            primary_nameservers:
                              description: 'Primary nameservers of the [Zone](#tag/zones).


                                Only set if [Zone](#tag/zones) is in [secondary mode](#tag/zones/zone-modes), otherwise empty.

                                '
                              type: array
                              items:
                                description: 'Primary nameserver that returns [Zones](#tag/zones) via `AXFR`.


                                  Must allow queries from and may send `NOTIFY` queries to [Hetzner''s secondary

                                  nameservers](https://docs.hetzner.com/dns-console/dns/general/authoritative-name-servers#secondary-dns-servers-old-name-servers-for-robot-customers).

                                  '
                                type: object
                                properties:
                                  address:
                                    description: Public IPv4 or IPv6 address of the primary nameserver.
                                    type: string
                                    example: 198.51.100.1
                                  port:
                                    description: Port of the primary nameserver.
                                    type: integer
                                    default: 53
                                    example: 5353
                                  tsig_key:
                                    description: '[Transaction signature (TSIG)](https://en.wikipedia.org/wiki/TSIG) key to use

                                      for the zone transfer. Must be base64 encoded.

                                      '
                                    type: string
                                  tsig_algorithm:
                                    description: '[Transaction signature (TSIG)](https://en.wikipedia.org/wiki/TSIG) algorithm

                                      used to generate the TSIG key.

                                      '
                                    type: string
                                    enum:
                                    - hmac-md5
                                    - hmac-sha1
                                    - hmac-sha256
                                required:
                                - address
                              example:
                              - address: 198.51.100.1
                                port: 53
                              - address: 203.0.113.1
                                port: 53
                            labels:
                              description: 'User-defined labels (`key/value` pairs) for the Resource.

                                For more information, see "[Labels](#description/labels)".

                                '
                              type: object
                              additionalProperties:
                                type: string
                              example:
                                environment: prod
                                example.com/my: label
                                just-a-key: ''
                            protection:
                              description: Protection configuration for the Resource.
                              type: object
                              properties:
                                delete:
                                  description: Prevent the Resource from being deleted.
                                  type: boolean
                                  example: false
                              required:
                              - delete
                            ttl:
                              description: 'Default Time To Live (TTL) of the [Zone](#tag/zones).


                                Must be in between 60s and 2147483647s.


                                This TTL is used for [RRSets](#tag/zone-rrsets) that do not explicitly define a TTL.

                                '
                              type: integer
                              default: 3600
                              minimum: 60
                              maximum: 2147483647
                              example: 10800
                            status:
                              description: 'Status of the [Zone](#tag/zones).

                                '
                              type: string
                              enum:
                              - ok
                              - updating
                              - error
                              x-enumDescriptions:
                                ok: The Zone is pushed to the authoritative nameservers.
                                updating: The Zone is currently being published to the authoritative nameservers.
                                error: The Zone could not be published to the authoritative nameservers.
                            record_count:
                              description: Number of resource records (RR) within the [Zone](#tag/zones).
                              type: integer
                            authoritative_nameservers:
                              type: object
                              properties:
                                assigned:
                                  description: 'Authoritative Hetzner nameservers assigned to this [Zone](#tag/zones).

                                    '
                                  type: array
                                  items:
                                    type: string
                                  example:
                                  - hydrogen.ns.hetzner.com.
                                  - oxygen.ns.hetzner.com.
                                  - helium.ns.hetzner.de.
                                delegated:
                                  description: 'Authoritative nameservers currently delegated to by the parent DNS zone.


                                    If these don''t match the assigned authoritative nameservers, the DNS zone is currently not being served by Hetzner.

                                    '
                                  type: array
                                  items:
                                    type: string
                                  example:
                                  - hydrogen.ns.hetzner.com.
                                  - oxygen.ns.hetzner.com.
                                  - helium.ns.hetzner.de.
                                delegation_last_check:
                                  description: 'Point in time (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format) when the DNS zone delegation was last checked.

                                    '
                                  type:
                                  - string
                                  - 'null'
                                  format: date-time
                                  example: '2016-01-30T23:55:00Z'
                                delegation_status:
                                  description: 'Status of the delegation.

                                    '
                                  type: string
                                  enum:
                                  - valid
                                  - partially-valid
                                  - invalid
                                  - lame
                                  - unregistered
                                  - unknown
                                  x-enumDescriptions:
                                    valid: Parent zone correctly delegates to assigned nameservers.
                                    partially-valid: Parent zone delegates to additional Hetzner nameservers not assigned to this zone.
                                    invalid: Parent zone does not delegate to the assigned nameservers.
                                    lame: Parent zone delegates to nameservers that don't know the zone.
                                    unregistered: Domain is not registered.
                                    unknown: Not yet known.
                              required:
                              - assigned
                              - delegated
                              - delegation_last_check
                            registrar:
                              description: Registrar of the domain.
                              type: string
                              enum:
                              - hetzner
                              - other
                              - unknown
                          required:
                          - id
                          - name
                          - labels
                          - created
                          - status
                          - ttl
                          - record_count
                          - protection
                          - authoritative_nameservers
                          - registrar
                        - type: object
                          properties:
                            mode:
                              enum:
                              - primary
                              description: 'Mode of the [Zone](#tag/zones).


                                For more information, see [Zone Modes](#tag/zones/zone-modes).

                                '
                              type: string
                              example: primary
                          required:
                          - mode
                      - title: Secondary Zone
                        allOf:
                        - type: object
                          properties:
                            id:
                              description: ID of the [Zone](#tag/zones).
                              type: integer
                              format: int64
                              minimum: 1
                              maximum: 9007199254740991
                              example: 42
                            name:
                              description: 'Name of the [Zone](#tag/zones).


                                All names with [well-known public suffixes](https://publicsuffix.org/) (e.g. `.de`,

                                `.com`, `.co.uk`) are supported. Subdomains are not supported.


                                The name must be in lower case and must not end with a dot.

                                [Internationalized domain

                                names](https://en.wikipedia.org/wiki/Internationalized_domain_name) must be

                                transcribed to [Punycode](https://wikipedia.org/wiki/Punycode) representation with

                                ACE prefix, e.g. `xn--mnchen-3ya.de` (`münchen.de`).

                                '
                              type: string
                              maxLength: 255
                              example: example.com
                            created:
                              description: Point in time when the Resource was created (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                              type: string
                              format: date-time
                              example: '2016-01-30T23:55:00Z'
                            primary_nameservers:
                              description: 'Primary nameservers of the [Zone](#tag/zones).


                                Only set if [Zone](#tag/zones) is in [secondary mode](#tag/zones/zone-modes), otherwise empty.

                                '
                              type: array
                              items:
                                description: 'Primary nameserver that returns [Zones](#tag/zones) via `AXFR`.


                                  Must allow queries from and may send `NOTIFY` queries to [Hetzner''s secondary

                                  nameservers](https://docs.hetzner.com/dns-console/dns/general/authoritative-name-servers#secondary-dns-servers-old-name-servers-for-robot-customers).

                                  '
                                type: object
                                properties:
                                  address:
                                    description: Public IPv4 or IPv6 address of the primary nameserver.
                                    type: string
                                    example: 198.51.100.1
                                  port:
                                    description: Port of the primary nameserver.
                                    type: integer
                                    default: 53
                                    example: 5353
                                  tsig_key:
                                    description: '[Transaction signature (TSIG)](https://en.wikipedia.org/wiki/TSIG) key to use

                                      for the zone transfer. Must be base64 encoded.

                                      '
                                    type: string
                                  tsig_algorithm:
                                    description: '[Transaction signature (TSIG)](https://en.wikipedia.org/wiki/TSIG) algorithm

                                      used to generate the TSIG key.

                                      '
                                    type: string
                                    enum:
                                    - hmac-md5
                                    - hmac-sha1
                                    - hmac-sha256
                                required:
                                - address
                              example:
                              - address: 198.51.100.1
                                port: 53
                              - address: 203.0.113.1
                                port: 53
                            labels:
                              description: 'User-defined labels (`key/value` pairs) for the Resource.

                                For more information, see "[Labels](#description/labels)".

                                '
                              type: object
                              additionalProperties:
                                type: string
                              example:
                                environment: prod
                                example.com/my: label
                                just-a-key: ''
                            protection:
                              description: Protection configuration for the Resource.
                              type: object
                              properties:
                                delete:
                                  description: Prevent the Resource from being deleted.
                                  type: boolean
                                  example: false
                              required:
                              - delete
                            ttl:
                              description: 'Default Time To Live (TTL) of the [Zone](#tag/zones).


                                Must be in between 60s and 2147483647s.


                                This TTL is used for [RRSets](#tag/zone-rrsets) that do not explicitly define a TTL.

                                '
                              type: integer
                              default: 3600
                              minimum: 60
                              maximum: 2147483647
                              example: 10800
                            status:
                              description: 'Status of the [Zone](#tag/zones).

                                '
                              type: string
                              enum:
                              - ok
                              - updating
                              - error
                              x-enumDescriptions:
                                ok: The Zone is pushed to the authoritative nameservers.
                                updating: The Zone is currently being published to the authoritative nameservers.
                                error: The Zone could not be published to the authoritative nameservers.
                            record_count:
                              description: Number of resource records (RR) within the [Zone](#tag/zones).
                              type: integer
                            authoritative_nameservers:
                              type: object
                              properties:
                                assigned:
                                  description: 'Authoritative Hetzner nameservers assigned to this [Zone](#tag/zones).

                                    '
                                  type: array
                                  items:
                                    type: string
                                  example:
                                  - hydrogen.ns.hetzner.com.
                                  - oxygen.ns.hetzner.com.
                                  - helium.ns.hetzner.de.
                                delegated:
                                  description: 'Authoritative nameservers currently delegated to by the parent DNS zone.


                                    If these don''t match the assigned authoritative nameservers, the DNS zone is currently not being served by Hetzner.

                                    '
                                  type: array
                                  items:
                                    type: string
                                  example:
                                  - hydrogen.ns.hetzner.com.
                                  - oxygen.ns.hetzner.com.
                                  - helium.ns.hetzner.de.
                                delegation_last_check:
                                  description: 'Point in time (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format) when the DNS zone delegation was last checked.

                                    '
                                  type:
                                  - string
                                  - 'null'
                                  format: date-time
                                  example: '2016-01-30T23:55:00Z'
                                delegation_status:
                                  description: 'Status of the delegation.

                                    '
                                  type: string
                                  enum:
                                  - valid
                                  - partially-valid
                                  - invalid
                                  - lame
                                  - unregistered
                                  - unknown
                                  x-enumDescriptions:
                                    valid: Parent zone correctly delegates to assigned nameservers.
                                    partially-valid: Parent zone delegates to additional Hetzner nameservers not assigned to this zone.
                                    invalid: Parent zone does not delegate to the assigned nameservers.
                                    lame: Parent zone delegates to nameservers that don't know the zone.
                                    unregistered: Domain is not registered.
                                    unknown: Not yet known.
                              required:
                              - assigned
                              - delegated
                              - delegation_last_check
                            registrar:
                              description: Registrar of the domain.
                              type: string
                              enum:
                              - hetzner
                              - other
                              - unknown
                          required:
                          - id
                          - name
                          - labels
                          - created
                          - status
                          - ttl
                          - record_count
                          - protection
                          - authoritative_nameservers
                          - registrar
                        - type: object
                          properties:
                            mode:
                              enum:
                              - secondary
                              example: secondary
                              description: 'Mode of the [Zone](#tag/zones).


                                For more information, see [Zone Modes](#tag/zones/zone-modes).

                                '
                              type: string
                          required:
                          - mode
                      discriminator:
                        propertyName: mode
                        mapping:
                          primary: '#/components/schemas/ZonePrimary'
                          secondary: '#/components/schemas/ZoneSecondary'
                  meta:
                    title: ListMeta
                    type: object
                    properties:
                      pagination:
                        description: See "[Pagination](#description/pagination)" for more information.
                        type: object
                        properties:
                          page:
                            description: Current page number.
                            type: integer
                            format: int64
                            example: 3
                          per_page:
                            description: Maximum number of entries returned per page.
                            type: integer
                            format: int64
                            example: 25
                          previous_page:
                            description: Page number of the previous page. Can be null if the current page is the first one.
                            type:
                            - integer
                            - 'null'
                            format: int64
                            example: 2
                          next_page:
                            description: Page number of the next page. Can be null if the current page is the last one.
                            type:
                            - integer
                            - 'null'
                            format: int64
                            example: 4
                          last_page:
                            description: Page number of the last page available. Can be null if the current page is the last one.
                            type:
                            - integer
                            - 'null'
                            format: int64
                            example: 4
                          total_entries:
                            description: Total number of entries that exist for this query. Can be null if unknown.
                            type:
                            - integer
                            - 'null'
                            format: int64
                            example: 100
                        required:
                        - page
                        - per_page
                        - previous_page
                        - next_page
                        - last_page
                        - total_entries
                    required:
                    - pagination
                required:
                - zones
                - meta
        4xx:
          description: Request failed with a user error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        description: Error code for machines.
                        type: string
                      message:
                        description: Error message for humans.
                        type: string
                      details:
                        description: Details about the error.
                        type:
                        - object
                        - 'null'
                    required:
                    - code
                    - message
                required:
                - error
                example:
                  error:
                    code: unauthorized
                    message: unable to authenticate
                    details: null
        5xx:
          description: Request failed with a server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        description: Error code for machines.
                        type: string
                      message:
                        description: Error message for humans.
                        type: string
                      details:
                        description: Details about the error.
                        type:
                        - object
                        - 'null'
                    required:
                    - code
                    - message
                required:
                - error
                example:
                  error:
                    code: timeout
                    message: request timeout
                    details: null
      security:
      - APIToken: []
      x-codeSamples:
      - lang: Go
        label: Go
        source: "package examples\n\nimport (\n\t\"context\"\n\t\"os\"\n\n\t\"github.com/hetznercloud/hcloud-go/v2/hcloud\"\n)\n\nfunc main() {\n\ttoken := os.Getenv(\"HCLOUD_TOKEN\")\n\n\tclient := hcloud.NewClient(hcloud.WithToken(token))\n\tctx := context.TODO()\n\n\tzones, err := client.Zone.All(ctx)\n}"
      - lang: Python
        label: Python
        source: 'from __future__ import annotations


          from os import environ


          from hcloud import Client


          token = environ["HCLOUD_TOKEN"]

          client = Client(token=token)


          zones = client.zones.get_all()'
      - lang: Shell
        label: CLI
        source: hcloud zone list
    post:
      operationId: create_zone
      summary: Create a Zone
      description: 'Creates a Zone.


        A default `SOA` and three `NS` resource records with the assigned Hetzner

        nameservers are created automatically.'
      tags:
      - Zones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: 'Name of the [Zone](#tag/zones).


                    All names with [well-known public suffixes](https://publicsuffix.org/) (e.g. `.de`,

                    `.com`, `.co.uk`) are supported. Subdomains are not supported.


                    The name must be in lower case and must not end with a dot.

                    [Internationalized domain

                    names](https://en.wikipedia.org/wiki/Internationalized_domain_name) must be

                    transcribed to [Punycode](https://wikipedia.org/wiki/Punycode) representation with

                    ACE prefix, e.g. `xn--mnchen-3ya.de` (`münchen.de`).

                    '
                  type: string
                  maxLength: 255
                  example: example.com
                mode:
                  description: 'Mode of the [Zone](#tag/zones).


                    For more information, see [Zone Modes](#tag/zones/zone-modes).

                    '
                  type: string
                  enum:
                  - primary
                  - secondary
                  example: primary
                ttl:
                  description: 'Default Time To Live (TTL) of the [Zone](#tag/zones).


                    Must be in between 60s and 2147483647s.


                    This TTL is used for [RRSets](#tag/zone-rrsets) that do not explicitly define a TTL.

                    '
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 2147483647
                  example: 10800
                labels:
                  description: 'User-defined labels (`key/value` pairs) for the Resource.

                    For more information, see "[Labels](#description/labels)".

                    '
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    environment: prod
                    example.com/my: label
                    just-a-key: ''
                primary_nameservers:
                  description: 'Primary nameservers of the [Zone](#tag/zones).


                    Only applicable for [Zones](#tag/zones) in secondary mode.

                    Ignored for [Zones](#tag/zones) in primary mode.

                    '
                  type: array
                  items:
                    description: 'Primary nameserver that returns [Zones](#tag/zones) via `AXFR`.


                      Must allow queries from and may send `NOTIFY` queries to [Hetzner''s secondary

                      nameservers](https://docs.hetzner.com/dns-console/dns/general/authoritative-name-servers#secondary-dns-servers-old-name-servers-for-robot-customers).

                      '
                    type: object
                    properties:
                      address:
                        description: Public IPv4 or IPv6 address of the primary nameserver.
                        type: string
                        example: 198.51.100.1
                      port:
                        description: Port of the primary nameserver.
                        type: integer
                        default: 53
                        example: 5353
                      tsig_key:
                        description: '[Transaction signature (TSIG)](https://en.wikipedia.org/wiki/TSIG) key to use

                          for the zone transfer. Must be base64 encoded.

                          '
                        type: string
                      tsig_algorithm:
                        description: '[Transaction signature (TSIG)](https://en.wikipedia.org/wiki/TSIG) algorithm

                          used to generate the TSIG key.

                          '
                        type: string
                        enum:
                        - hmac-md5
                        - hmac-sha1
                        - hmac-sha256
                    required:
                    - address
                  example:
                  - address: 198.51.100.1
                    port: 53
                  - address: 203.0.113.1
                    port: 53
                rrsets:
                  description: '[RRSets](#tag/zone-rrsets) to be added to the [Zone](#tag/zones).


                    Only applicable for [Zones](#tag/zones) in primary mode.

                    Ignored for [Zones](#tag/zones) in secondary mode.

                    '
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        description: 'Name of the [RRSet](#tag/zone-rrsets).


                          The name must be in lower case, and must not end with a dot or the [Zone](#tag/zones)

                          name. Names containing non-ASCII characters must be transcribed to

                          [Punycode](https://wikipedia.org/wiki/Punycode) representation with ACE prefix, e.g.

                          `xn--4bi` (✉️).


                          For the [Zone](#tag/zones) apex, use `@`.

                          '
                        type: string
                        example: www
                      type:
                        description: 'Type of the [RRSet](#tag/zone-rrsets).

                          '
                        type: string
                        enum:
                        - A
                        - AAAA
                        - CAA
                        - CNAME
                        - DS
                        - HINFO
                        - HTTPS
                        - MX
                        - NS
                        - PTR
                        - RP
                        - SOA
                        - SRV
                        - SVCB
                        - TLSA
                        - TXT
                        example: A
                      ttl:
                        description: 'Time To Live (TTL) of the [RRSet](#tag/zone-rrsets).


                          Must be in between 60s and 2147483647s.


                          If not set, the [Zone''s](#tag/zones) Default TTL is used.

                          '
                        type:
                        - integer
                        - 'null'
                        minimum: 60
                        maximum: 2147483647
                        example: 3600
                      records:
                        description: 'Records of the [RRSet](#tag/zone-rrsets).


