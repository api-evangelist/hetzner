  /networks/{id}/actions/add_route:
    post:
      operationId: add_network_route
      summary: Add a route to a Network
      description: 'Adds a route entry to a Network.


        If a change is currently being performed on this Network, a error response with code `conflict` will be returned.'
      tags:
      - Network Actions
      parameters:
      - description: ID of the Network.
        name: id
        in: path
        required: true
        schema:
          description: ID of the [Network](#tag/networks).
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: AddRouteRequest
              type: object
              properties:
                destination:
                  description: 'Destination network or host of the route.


                    Packages addressed for IPs matching the destination IP prefix will be send to the specified gateway.


                    Must be one of

                    * private IPv4 ranges of RFC1918

                    * or `0.0.0.0/0`.


                    Must not overlap with

                    * an existing ip_range in any subnets

                    * or with any destinations in other routes

                    * or with `172.31.1.1`.


                    `172.31.1.1` is being used as a gateway for the public network interface of [Servers](#tag/servers).

                    '
                  type: string
                  example: 10.100.1.0/24
                gateway:
                  description: 'Gateway of the route.


                    Packages addressed for the specified destination will be send to this IP address.


                    Cannot be

                    * the first IP of the networks ip_range,

                    * an IP behind a vSwitch or

                    * `172.31.1.1`.


                    `172.31.1.1` is being used as a gateway for the public network interface of [Servers](#tag/servers).

                    '
                  type: string
                  example: 10.0.1.1
              required:
              - destination
              - gateway
      responses:
        '201':
          description: Request succeeded.
          content:
            application/json:
              schema:
                title: ActionResponse
                description: 'Response for a created [Action](#description/actions).


                  Make sure to wait for the [Action](#description/actions) completion to ensure your changes are applied.

                  '
                type: object
                properties:
                  action:
                    title: Action
                    type: object
                    properties:
                      id:
                        description: ID of the [Action](#description/actions).
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9007199254740991
                        example: 42
                      command:
                        description: Command executed in the Action.
                        type: string
                        example: start_resource
                      status:
                        description: Status of the Action.
                        type: string
                        enum:
                        - running
                        - success
                        - error
                      started:
                        description: Point in time when the Action was started (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                        type: string
                        format: date-time
                        example: '2016-01-30T23:55:00Z'
                      finished:
                        description: Point in time when the Action was finished (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format). Only set if the Action is finished otherwise null.
                        type:
                        - string
                        - 'null'
                        format: date-time
                        example: '2016-01-30T23:55:00Z'
                      progress:
                        description: Progress of the Action in percent.
                        type: integer
                        format: int32
                        example: 100
                      resources:
                        description: Resources the Action relates to.
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: ID of the Resource.
                              type: integer
                              format: int64
                              minimum: 1
                              maximum: 9007199254740991
                              example: 42
                            type:
                              description: Type of the Resource.
                              type: string
                              example: server
                          required:
                          - id
                          - type
                      error:
                        description: Error message for the Action if an error occurred, otherwise null.
                        type:
                        - object
                        - 'null'
                        properties:
                          code:
