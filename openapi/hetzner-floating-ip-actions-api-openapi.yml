  /floating_ips/{id}/actions/change_dns_ptr:
    post:
      operationId: change_floating_ip_dns_ptr
      summary: Change reverse DNS records for a Floating IP
      description: 'Change the reverse DNS records for this Floating IP.


        Allows to modify the PTR records set for the IP address.'
      tags:
      - Floating IP Actions
      parameters:
      - description: ID of the Floating IP.
        name: id
        in: path
        required: true
        schema:
          description: ID of the [Floating IP](#tag/floating-ips).
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          example: 42
      requestBody:
        description: 'The `ip` attributes specifies for which IP address the record is set. For IPv4 addresses this must be the exact address of the [Floating IP](#tag/floating-ips). For IPv6 addresses this must be a single address within the `/64` subnet of the [Floating IP](#tag/floating-ips).


          The `dns_ptr` attribute specifies the hostname used for the IP address. Must be a fully qualified domain name (FQDN) without trailing dot.


          For IPv6 [Floating IPs](#tag/floating-ips) up to 100 entries can be created.

          '
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ip:
                  description: 'Single IPv4 or IPv6 address to create pointer for.

                    '
                  type: string
                  example: 2001:db8::1
                dns_ptr:
                  description: 'Domain Name to point to.


                    PTR record content used for reverse DNS. Set to null to reset (IPv4) to the default value or remove (IPv6) the record.

                    '
                  type:
                  - string
                  - 'null'
                  example: server.example.com
