                          additionalProperties:
                            type: string
                          example:
                            environment: prod
                            example.com/my: label
                            just-a-key: ''
                        type:
                          description: 'Type of Placement Group.

                            '
                          type: string
                          enum:
                          - spread
                          example: spread
                        created:
                          description: Point in time when the Resource was created (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                          type: string
                          format: date-time
                          example: '2016-01-30T23:55:00Z'
                        servers:
                          description: Array of IDs of Servers that are part of this Placement Group.
                          type: array
                          items:
                            type: integer
                            format: int64
                          example:
                          - 42
                      required:
                      - id
                      - name
                      - labels
                      - type
                      - created
                      - servers
