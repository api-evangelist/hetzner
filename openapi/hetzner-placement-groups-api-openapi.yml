openapi: 3.2.0
info:
  title: Hetzner Cloud Placement Groups API
  version: 1.0.0
  x-summary: 'Manage Hetzner Cloud services and resources linked to them, such as Floating IPs, Volumes and Load Balancers.

    '
  description: '# Overview


    This is the official documentation for the Hetzner Cloud API.'
servers:
- url: https://api.hetzner.cloud/v1
security:
- APIToken: []
tags:
- name: Placement Groups
  description: Placement groups are used to influence the location of interdependent virtual servers in our data centers.
paths:
