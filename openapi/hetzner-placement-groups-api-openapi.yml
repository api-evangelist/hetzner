    post:
      operationId: create_placement_group
      summary: Create a PlacementGroup
      description: Creates a new Placement Group.
      tags:
      - Placement Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreatePlacementGroupRequest
              type: object
              properties:
                name:
                  description: Name of the Placement Group.
                  type: string
                  example: my Placement Group
                labels:
                  description: 'User-defined labels (`key/value` pairs) for the Resource.

                    For more information, see "[Labels](#description/labels)".

                    '
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    environment: prod
                    example.com/my: label
                    just-a-key: ''
                type:
                  description: Define the Placement Group Type.
                  type: string
                  enum:
                  - spread
                  example: spread
              required:
              - name
              - type
            examples:
              default:
                value:
                  name: my Placement Group
                  type: spread
