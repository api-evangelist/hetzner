            application/json:
              schema:
                type: object
                properties:
                  network:
                    type: object
                    properties:
                      id:
                        description: ID of the [Network](#tag/networks).
                        type: integer
                        format: int64
                        example: 4711
                      name:
                        description: Name of the [Network](#tag/networks).
                        type: string
                        example: mynet
                      ip_range:
                        description: 'IP range of the [Network](#tag/networks).


                          Uses CIDR notation.

                          '
                        type: string
                        example: 10.0.0.0/16
                      subnets:
                        description: List of subnets allocated in this [Network](#tag/networks).
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              description: 'Type of subnet.

                                '
                              type: string
                              enum:
                              - cloud
                              - server
                              - vswitch
                              x-enumDescriptions:
                                cloud: Used to connect cloud [Servers](#tag/servers) and [Load Balancers](#tag/load-balancers).
                                server: Same as the `cloud` type. **Deprecated**, use the `cloud` type instead.
                                vswitch: Used to [connect cloud Servers and Load Balancers with dedicated Servers](https://docs.hetzner.com/cloud/networks/connect-dedi-vswitch).
                            ip_range:
                              description: 'IP range of the subnet.


                                Uses CIDR notation.

                                '
                              type: string
                              example: 10.0.1.0/24
                            network_zone:
                              description: 'Name of the [Network Zone](#tag/network-zones).


                                The [Location](#tag/locations) contains the `network_zone` property it belongs to.

                                '
                              type: string
                              example: eu-central
                            gateway:
                              description: 'Gateway for [Servers](#tag/servers) attached to this subnet.


                                For subnets of type `server` this is always the first IP of the subnets IP range.

                                '
                              type: string
                              example: 10.0.0.1
                            vswitch_id:
                              description: ID of the robot vSwitch if the subnet is of type `vswitch`.
                              type:
                              - integer
                              - 'null'
                              format: int64
                              example: 1000
                          required:
                          - type
                          - network_zone
                          - gateway
                      routes:
                        description: Array of routes set in this [Network](#tag/networks).
                        type: array
                        items:
                          type: object
                          properties:
                            destination:
                              description: 'Destination network or host of the route.


                                Packages addressed for IPs matching the destination IP prefix will be send to the specified gateway.


                                Must be one of

                                * private IPv4 ranges of RFC1918

                                * or `0.0.0.0/0`.


                                Must not overlap with

                                * an existing ip_range in any subnets

                                * or with any destinations in other routes

                                * or with `172.31.1.1`.


                                `172.31.1.1` is being used as a gateway for the public network interface of [Servers](#tag/servers).

                                '
                              type: string
                              example: 10.100.1.0/24
                            gateway:
                              description: 'Gateway of the route.


                                Packages addressed for the specified destination will be send to this IP address.


                                Cannot be

                                * the first IP of the networks ip_range,

                                * an IP behind a vSwitch or

                                * `172.31.1.1`.


                                `172.31.1.1` is being used as a gateway for the public network interface of [Servers](#tag/servers).

                                '
                              type: string
                              example: 10.0.1.1
                          required:
                          - destination
                          - gateway
                      servers:
                        description: Array of IDs of [Servers](#tag/servers) attached to this [Network](#tag/networks).
                        type: array
                        items:
                          type: integer
                          format: int64
                        example:
                        - 42
                      load_balancers:
                        description: Array of IDs of [Load Balancers](#tag/load-balancers) attached to this [Network](#tag/networks).
                        type: array
                        items:
                          type: integer
                          format: int64
                        example:
                        - 42
                      protection:
                        description: Protection configuration for the Resource.
                        type: object
                        properties:
                          delete:
                            description: Prevent the Resource from being deleted.
                            type: boolean
                            example: false
                        required:
                        - delete
                      labels:
                        description: 'User-defined labels (`key/value` pairs) for the Resource.

