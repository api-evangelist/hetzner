                    - bound_to
                    - os_flavor
                    - os_version
                    - protection
                    - deprecated
                    - deleted
                    - labels
                    - architecture
              examples:
                default:
                  value:
                    image:
                      id: 4711
                      type: snapshot
                      status: available
                      name: null
                      description: My new Image description
                      image_size: 2.3
                      disk_size: 10
                      created: '2016-01-30T23:50:00Z'
                      created_from:
                        id: 1
                        name: Server
                      bound_to: null
                      os_flavor: ubuntu
                      os_version: '20.04'
                      rapid_deploy: false
                      protection:
                        delete: false
                      deprecated: '2018-02-28T00:00:00Z'
                      deleted: null
                      labels:
                        key: value
                      architecture: x86
