        source: hcloud image describe $IMAGE
    put:
      operationId: update_image
      summary: Update an Image
      description: Updates the Image. You may change the description, convert a Backup Image to a Snapshot Image or change the Image labels. Only Images of type `snapshot` and `backup` can be updated.
      tags:
      - Images
      parameters:
      - description: ID of the Image.
        name: id
        in: path
        required: true
        schema:
          description: ID of the [Image](#tag/images).
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: UpdateImageRequest
              type: object
              properties:
                description:
                  description: New description of Image.
                  type: string
                  example: My new Image description
                type:
                  description: Destination Image type to convert to.
                  type: string
                  enum:
                  - snapshot
                labels:
                  description: 'User-defined labels (`key/value` pairs) for the Resource.


                    Note that the set of [Labels](#description/labels) provided in the request will overwrite the

                    existing one.


                    For more information, see "[Labels](#description/labels)".

                    '
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    environment: prod
                    example.com/my: label
                    just-a-key: ''
      responses:
        '200':
          description: Request succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  image:
                    type: object
                    properties:
                      id:
                        description: ID of the [Image](#tag/images).
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9007199254740991
                        example: 42
                      type:
                        description: Type of the Image.
                        type: string
                        enum:
                        - system
                        - app
                        - snapshot
                        - backup
                        example: snapshot
                      status:
                        description: Status of the Image.
                        type: string
                        enum:
                        - available
                        - creating
                        - unavailable
                        example: available
                      name:
                        description: Unique identifier of the Image. This value is only set for system Images.
                        type:
                        - string
                        - 'null'
                        example: ubuntu-24.04
                      description:
                        description: Description of the Image.
                        type: string
                        example: Ubuntu 24.04 Standard 64 bit
                      image_size:
                        description: Size of the Image file in our storage in GB. For snapshot Images this is the value relevant for calculating costs for the Image.
                        type:
                        - number
                        - 'null'
                        example: 2.3
                      disk_size:
                        description: Size of the disk contained in the Image in GB.
                        type: number
                        example: 10
                      created:
                        description: Point in time when the Resource was created (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                        type: string
                        format: date-time
                        example: '2016-01-30T23:55:00Z'
                      created_from:
                        description: Information about the Server the Image was created from.
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            description: ID of the Server the Image was created from.
                            type: integer
                            format: int64
                            example: 1
                          name:
                            description: Server name at the time the Image was created.
                            type: string
                            example: Server
                        required:
                        - id
                        - name
                      bound_to:
                        description: ID of Server the Image is bound to. Only set for Images of type `backup`.
                        type:
                        - integer
                        - 'null'
                        format: int64
                        example: null
                      os_flavor:
                        description: Flavor of operating system contained in the Image.
                        type: string
                        enum:
                        - ubuntu
                        - centos
                        - debian
                        - fedora
                        - rocky
                        - alma
                        - opensuse
                        - unknown
                        example: ubuntu
                      os_version:
                        description: Operating system version.
                        type:
                        - string
