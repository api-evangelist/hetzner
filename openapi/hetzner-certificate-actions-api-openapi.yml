  /certificates/{id}/actions/retry:
    post:
      operationId: retry_certificate
      summary: Retry Issuance or Renewal
      description: 'Retry a failed Certificate issuance or renewal.


        Only applicable if the type of the Certificate is `managed` and the issuance or renewal status is `failed`.


        #### Operation specific errors


        | Status | Code | Description |

        | --- | --- | --- |

        | | `caa_record_does_not_allow_ca` | CAA record does not allow certificate authority |

        | | `ca_dns_validation_failed` | Certificate Authority: DNS validation failed |

        | | `ca_too_many_authorizations_failed_recently` | Certificate Authority: Too many authorizations failed recently |

        | | `ca_too_many_certificates_issued_for_registered_domain` | Certificate Authority: Too many certificates issued for registered domain |

        | | `ca_too_many_duplicate_certificates` | Certificate Authority: Too many duplicate certificates |

        | | `could_not_verify_domain_delegated_to_zone` | Could not verify domain delegated to zone |

        | | `dns_zone_not_found` | DNS zone not found |

        | | `dns_zone_is_secondary_zone` | DNS zone is a secondary zone |'
      tags:
      - Certificate Actions
      parameters:
      - description: ID of the Certificate.
        name: id
        in: path
        required: true
        schema:
          description: ID of the [Certificate](#tag/certificates).
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          example: 42
      responses:
        '201':
          description: Request succeeded.
          content:
            application/json:
              schema:
                title: ActionResponse
                description: 'Response for a created [Action](#description/actions).


                  Make sure to wait for the [Action](#description/actions) completion to ensure your changes are applied.

                  '
                type: object
                properties:
                  action:
                    title: Action
                    type: object
                    properties:
                      id:
                        description: ID of the [Action](#description/actions).
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9007199254740991
                        example: 42
                      command:
                        description: Command executed in the Action.
                        type: string
                        example: start_resource
                      status:
                        description: Status of the Action.
                        type: string
                        enum:
                        - running
                        - success
                        - error
                      started:
                        description: Point in time when the Action was started (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                        type: string
                        format: date-time
                        example: '2016-01-30T23:55:00Z'
                      finished:
                        description: Point in time when the Action was finished (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format). Only set if the Action is finished otherwise null.
                        type:
                        - string
                        - 'null'
                        format: date-time
                        example: '2016-01-30T23:55:00Z'
                      progress:
                        description: Progress of the Action in percent.
                        type: integer
                        format: int32
                        example: 100
                      resources:
                        description: Resources the Action relates to.
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: ID of the Resource.
                              type: integer
                              format: int64
                              minimum: 1
                              maximum: 9007199254740991
                              example: 42
                            type:
                              description: Type of the Resource.
                              type: string
                              example: server
                          required:
                          - id
                          - type
                      error:
                        description: Error message for the Action if an error occurred, otherwise null.
                        type:
                        - object
                        - 'null'
                        properties:
                          code:
                            description: Fixed error code for machines.
                            type: string
                            example: action_failed
                          message:
                            description: Error message for humans.
                            type: string
                            example: Action failed
                        required:
                        - code
                        - message
                    required:
                    - id
                    - command
                    - status
                    - progress
                    - started
                    - finished
                    - resources
                    - error
                required:
