  /servers/{id}/actions/add_to_placement_group:
    post:
      operationId: add_server_to_placement_group
      summary: Add a Server to a Placement Group
      description: 'Adds a Server to a Placement Group.


        Server must be powered off for this command to succeed.


        #### Operation specific errors


        | Status | Code | Description |

        | --- | --- | --- |

        | `422` | `server_not_stopped` | The action requires a stopped server |

        | `422` | `already_in_placement_group` | The server is already part of a placement group |'
      tags:
      - Server Actions
      parameters:
      - description: ID of the Server.
        name: id
        in: path
        required: true
        schema:
          description: ID of the [Server](#tag/servers).
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: AddToPlacementGroupRequest
              type: object
              properties:
                placement_group:
                  description: ID of Placement Group the Server should be added to.
                  type: integer
                  format: int64
                  example: 1
              required:
              - placement_group
      responses:
        '201':
          description: Request succeeded.
          content:
            application/json:
              schema:
                title: ActionResponse
                description: 'Response for a created [Action](#description/actions).


                  Make sure to wait for the [Action](#description/actions) completion to ensure your changes are applied.

                  '
                type: object
                properties:
