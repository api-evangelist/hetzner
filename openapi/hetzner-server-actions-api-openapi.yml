  /servers/{id}/actions/attach_to_network:
    post:
      operationId: attach_server_to_network
      summary: Attach a Server to a Network
      description: 'Attaches a Server to a network. This will complement the fixed public Server interface by adding an additional ethernet interface to the Server which is connected to the specified network.


        The Server will get an IP auto assigned from a subnet of type `server` in the same `network_zone`.


        Using the `alias_ips` attribute you can also define one or more additional IPs to the Servers. Please note that you will have to configure these IPs by hand on your Server since only the primary IP will be given out by DHCP.


        #### Operation specific errors


        | Status | Code | Description |

        | --- | --- | --- |

        | `422` | `server_already_attached` | The server is already attached to the network |

        | `422` | `ip_not_available` | The provided Network IP is not available |

        | `422` | `no_subnet_available` | No Subnet or IP is available for the Server within the network |

        | `422` | `networks_overlap` | The network IP range overlaps with one of the server networks |'
      tags:
      - Server Actions
      parameters:
      - description: ID of the Server.
        name: id
        in: path
        required: true
        schema:
          description: ID of the [Server](#tag/servers).
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: AttachToNetworkRequest
              type: object
              properties:
                network:
                  description: ID of an existing network to attach the Server to.
                  type: integer
                  format: int64
                  example: 4711
                ip:
                  description: IP to request to be assigned to this Server; if you do not provide this then you will be auto assigned an IP address.
                  type: string
                  example: 10.0.1.1
                alias_ips:
                  description: Additional IPs to be assigned to this Server.
                  type: array
                  items:
                    type: string
                  example:
                  - 10.0.1.2
                ip_range:
                  description: 'IP range in CIDR block notation of the subnet to attach to.


                    This allows for auto assigning an IP address for a specific subnet.

                    Providing `ip` that is not part of `ip_range` will result in an error.

                    '
                  type: string
                  example: 10.0.1.0/24
