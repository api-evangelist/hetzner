  /servers/{id}/actions/change_type:
    post:
      operationId: change_server_type
      summary: Change the Type of a Server
      description: 'Changes the type (Cores, RAM and disk sizes) of a Server.


        Server must be powered off for this command to succeed.


        This copies the content of its disk, and starts it again.


        You can only migrate to Server types with the same `storage_type` and equal or bigger disks. Shrinking disks is not possible as it might destroy data.


        If the disk gets upgraded, the Server type can not be downgraded any more. If you plan to downgrade the Server type, set `upgrade_disk` to `false`.


        #### Operation specific errors


        | Status | Code | Description |

        | --- | --- | --- |

        | `422` | `invalid_server_type` | The server type does not fit for the given server or is deprecated |

        | `422` | `server_not_stopped` | The action requires a stopped server |

        '
      tags:
      - Server Actions
      parameters:
      - description: ID of the Server.
        name: id
        in: path
        required: true
        schema:
          description: ID of the [Server](#tag/servers).
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                upgrade_disk:
                  description: If false, do not upgrade the disk (this allows downgrading the Server type later).
                  type: boolean
                  example: true
                server_type:
                  description: ID or name of Server type the Server should migrate to.
                  type: string
                  example: cpx22
              required:
              - upgrade_disk
              - server_type
      responses:
        '201':
          description: Request succeeded.
          content:
            application/json:
              schema:
                title: ActionResponse
                description: 'Response for a created [Action](#description/actions).


                  Make sure to wait for the [Action](#description/actions) completion to ensure your changes are applied.

                  '
