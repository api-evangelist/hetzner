  /firewalls/{id}/actions/apply_to_resources:
    post:
      operationId: apply_firewall_to_resources
      summary: Apply to Resources
      description: 'Applies a Firewall to multiple resources.


        Supported resources:

        - Servers (with a public network interface)

        - Label Selectors


        A Server can be applied to a maximum of 5 Firewalls. This limit

        applies to Servers applied via a matching Label Selector as well.


        Updates to resources matching or no longer matching a Label Selector can take up to a few seconds

        to be processed.


        A Firewall is applied to a resource once the related Action with command `apply_firewall` successfully finished.


        #### Operation specific errors


        | Status | Code | Description |

        | --- | --- | --- |

        | `404` | `firewall_resource_not_found` | The resource the Firewall should be applied to was not found |

        | `422` | `firewall_already_applied` | Firewall is already applied to resource |

        | `422` | `incompatible_network_type` | The network type of the resource is not supported by Firewalls |

        | `422` | `private_net_only_server` | The Server the Firewall should be applied to has no public interface |'
      tags:
      - Firewall Actions
      parameters:
      - description: ID of the Firewall.
        name: id
        in: path
        required: true
        schema:
          description: ID of the [Firewall](#tag/firewalls).
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ApplyToResourcesRequest
              type: object
              properties:
                apply_to:
                  description: 'Resources to apply the [Firewall](#tag/firewalls) to.


                    Extends existing resources.

                    '
                  type: array
                  items:
                    title: FirewallResource
                    type: object
                    properties:
                      type:
                        description: Type of the resource.
                        type: string
                        enum:
                        - server
                        - label_selector
                      server:
                        description: '[Server](#tag/servers) the [Firewall](#tag/firewalls) is applied to.


                          Only set for `type` `server`, otherwise `null`.

                          '
                        type: object
                        properties:
                          id:
                            description: ID of the [Server](#tag/servers).
                            type: integer
                            format: int64
                        required:
                        - id
                      label_selector:
                        description: '[Label Selector](#description/label-selector) the [Firewall](#tag/firewalls) is applied to.


                          Only set for `type` `label_selector`, otherwise `null`.

                          '
                        type: object
                        properties:
                          selector:
                            description: The selector.
                            type: string
                            example: env=prod
                        required:
                        - selector
                    required:
                    - type
              required:
              - apply_to
            examples:
              default:
                value:
                  apply_to:
                  - type: server
                    server:
                      id: 42
