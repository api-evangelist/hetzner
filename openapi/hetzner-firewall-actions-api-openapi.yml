  /firewalls/{id}/actions/set_rules:
    post:
      operationId: set_firewall_rules
      summary: Set Rules
      description: 'Set the rules of a Firewall.


        Overwrites the existing rules with the given ones. Pass an empty array to remove all rules.


        Rules are limited to 50 entries per Firewall and 500 effective rules.'
      tags:
      - Firewall Actions
      parameters:
      - description: ID of the Firewall.
        name: id
        in: path
        required: true
        schema:
          description: ID of the [Firewall](#tag/firewalls).
          type: integer
          format: int64
