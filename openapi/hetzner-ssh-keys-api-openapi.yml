      security:
      - APIToken: []
      x-codeSamples:
      - lang: Go
        label: Go
        source: "package examples\n\nimport (\n\t\"context\"\n\t\"os\"\n\n\t\"github.com/hetznercloud/hcloud-go/v2/hcloud\"\n)\n\nfunc main() {\n\ttoken := os.Getenv(\"HCLOUD_TOKEN\")\n\n\tclient := hcloud.NewClient(hcloud.WithToken(token))\n\tctx := context.TODO()\n\n\tsshKey, _, err := client.SSHKey.GetByID(ctx, 123)\n}"
      - lang: Python
        label: Python
        source: 'from __future__ import annotations


          from os import environ


          from hcloud import Client


          token = environ["HCLOUD_TOKEN"]

          client = Client(token=token)


          ssh_key = client.ssh_keys.get_by_id(123)'
      - lang: Shell
        label: CLI
        source: hcloud ssh-key describe $SSHKEY
    put:
      operationId: update_ssh_key
      summary: Update an SSH key
      description: Updates an SSH key. You can update an SSH key name and an SSH key labels.
      tags:
      - SSH Keys
      parameters:
      - description: ID of the SSH Key.
        name: id
        in: path
        required: true
        schema:
          description: ID of the [SSH Key](#tag/ssh-keys).
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: New name Name to set.
                  type: string
                  example: My ssh key
                labels:
                  description: 'User-defined labels (`key/value` pairs) for the Resource.


                    Note that the set of [Labels](#description/labels) provided in the request will overwrite the

                    existing one.


                    For more information, see "[Labels](#description/labels)".

                    '
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    environment: prod
                    example.com/my: label
                    just-a-key: ''
      responses:
        '200':
          description: Request succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ssh_key:
                    type: object
                    properties:
                      id:
                        description: ID of the [SSH Key](#tag/ssh-keys).
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9007199254740991
                        example: 42
                      name:
                        description: Name of the Resource. Must be unique per Project.
                        type: string
                        example: my-resource
                      fingerprint:
                        description: MD5 fingerprint of the SSH public key.
                        type: string
                        example: b7:2f:30:a0:2f:6c:58:6c:21:04:58:61:ba:06:3b:2f
                      public_key:
                        description: Public key.
                        type: string
                        example: ssh-rsa AAAjjk76kgf...Xt
                      labels:
                        description: 'User-defined labels (`key/value` pairs) for the Resource.

                          For more information, see "[Labels](#description/labels)".

                          '
                        type: object
                        additionalProperties:
                          type: string
                        example:
                          environment: prod
                          example.com/my: label
                          just-a-key: ''
                      created:
                        description: Point in time when the Resource was created (in [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format).
                        type: string
                        format: date-time
                        example: '2016-01-30T23:55:00Z'
                    required:
                    - id
                    - name
                    - fingerprint
                    - public_key
                    - labels
                    - created
                required:
                - ssh_key
              examples:
                default:
                  value:
                    ssh_key:
                      id: 2323
                      name: My ssh key
                      fingerprint: b7:2f:30:a0:2f:6c:58:6c:21:04:58:61:ba:06:3b:2f
                      public_key: ssh-rsa AAAjjk76kgf...Xt
                      labels:
                        key: value
                      created: '2016-01-30T23:50:00Z'
        4xx:
          description: Request failed with a user error.
