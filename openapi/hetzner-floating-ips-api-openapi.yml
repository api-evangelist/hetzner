                    - error
                required:
                - floating_ip
              examples:
                default:
                  value:
                    floating_ip:
                      id: 4711
                      name: Web Frontend
                      description: Web Frontend
                      ip: 2001:db8::/64
                      type: ipv6
                      server: 42
                      dns_ptr:
                      - ip: 2001:db8::1
                        dns_ptr: server.example.com
                      home_location:
                        id: 1
                        name: fsn1
                        description: Falkenstein DC Park 1
                        country: DE
                        city: Falkenstein
                        latitude: 50.47612
                        longitude: 12.370071
                        network_zone: eu-central
                      blocked: false
