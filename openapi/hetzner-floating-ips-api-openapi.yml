                        - object
                        - 'null'
                    required:
                    - code
                    - message
                required:
                - error
                example:
                  error:
                    code: timeout
                    message: request timeout
                    details: null
      security:
      - APIToken: []
      x-codeSamples:
      - lang: Go
        label: Go
        source: "package examples\n\nimport (\n\t\"context\"\n\t\"os\"\n\n\t\"github.com/hetznercloud/hcloud-go/v2/hcloud\"\n)\n\nfunc main() {\n\ttoken := os.Getenv(\"HCLOUD_TOKEN\")\n\n\tclient := hcloud.NewClient(hcloud.WithToken(token))\n\tctx := context.TODO()\n\n\tfloatingIPs, err := client.FloatingIP.All(ctx)\n}"
      - lang: Python
        label: Python
        source: 'from __future__ import annotations


          from os import environ


          from hcloud import Client


          token = environ["HCLOUD_TOKEN"]

          client = Client(token=token)


          floating_ips = client.floating_ips.get_all()'
      - lang: Shell
        label: CLI
        source: hcloud floating-ip list
    post:
      operationId: create_floating_ip
      summary: Create a Floating IP
      description: 'Create a Floating IP.


        Provide the `server` attribute to assign the Floating IP to that server or provide a `home_location` to locate the Floating IP at. Note that the Floating IP can be assigned to a Server in any Location later on. For optimal routing it is advised to use the Floating IP in the same Location it was created in.'
      tags:
      - Floating IPs
      requestBody:
        description: The `type` argument is required while `home_location` and `server` are mutually exclusive.
        required: true
        content:
          application/json:
            schema:
              title: FloatingIPCreateRequest
              type: object
              properties:
                type:
                  description: The Floating IP type.
                  type: string
                  enum:
                  - ipv4
                  - ipv6
                  example: ipv6
                server:
                  description: '[Server](#tag/servers) the [Floating IP](#tag/floating-ips) is assigned to.


                    `null` if not assigned.

                    '
                  type:
                  - integer
                  - 'null'
                  format: int64
                  example: 42
                home_location:
                  description: 'Home [Location](#tag/locations) for the [Floating IP](#tag/floating-ips).


                    Either the ID or the name of the [Location](#tag/locations).


                    Only optional if no [Server](#tag/servers) is provided. Routing is optimized for this [Locations](#tag/locations).

                    '
                  oneOf:
                  - description: 'Home [Location](#tag/locations) for the [Floating IP](#tag/floating-ips).


                      Either the ID or the name of the [Location](#tag/locations).


                      Only optional if no [Server](#tag/servers) is provided. Routing is optimized for this [Locations](#tag/locations).

                      '
                    type: string
                    example: fsn1
                  - description: 'Home [Location](#tag/locations) for the [Floating IP](#tag/floating-ips).


                      Either the ID or the name of the [Location](#tag/locations).


                      Only optional if no [Server](#tag/servers) is provided. Routing is optimized for this [Locations](#tag/locations).

                      '
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9007199254740991
                    example: 42
                description:
                  description: Description of the Resource.
                  type:
                  - string
                  - 'null'
                  example: This describes my resource
                name:
                  description: Name of the Resource. Must be unique per Project.
                  type: string
                  example: my-resource
                labels:
                  description: 'User-defined labels (`key/value` pairs) for the Resource.

                    For more information, see "[Labels](#description/labels)".

                    '
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    environment: prod
                    example.com/my: label
                    just-a-key: ''
              required:
              - type
      responses:
        '201':
          description: Request succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  floating_ip:
                    type: object
                    properties:
                      id:
                        description: ID of the [Floating IP](#tag/floating-ips).
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9007199254740991
                        example: 42
                      name:
                        description: Name of the Resource. Must be unique per Project.
                        type: string
                        example: my-resource
                      description:
                        description: Description of the Resource.
                        type:
                        - string
                        - 'null'
